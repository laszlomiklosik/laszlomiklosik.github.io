<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d2b1a"/>
      <stop offset="100%" stop-color="#2a1d10"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Five strings representing D-A-E-A-D symmetry -->
  <g opacity="0.35">
    <line x1="200" y1="60" x2="200" y2="340" stroke="#D4A843" stroke-width="1.8"/>
    <line x1="250" y1="50" x2="250" y2="350" stroke="#D4A843" stroke-width="1.4"/>
    <line x1="300" y1="45" x2="300" y2="355" stroke="#D4A843" stroke-width="2.2"/>
    <line x1="350" y1="50" x2="350" y2="350" stroke="#D4A843" stroke-width="1.4"/>
    <line x1="400" y1="60" x2="400" y2="340" stroke="#D4A843" stroke-width="1.8"/>
  </g>
  <!-- Mirror axis highlight on center E string -->
  <line x1="300" y1="45" x2="300" y2="355" stroke="#D4A843" stroke-width="0.6" opacity="0.6"/>
  <!-- Tuning labels at top -->
  <text x="200" y="40" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#D4A843" opacity="0.7" font-weight="700">D</text>
  <text x="250" y="35" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#D4A843" opacity="0.7" font-weight="700">A</text>
  <text x="300" y="30" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#D4A843" opacity="0.9" font-weight="700">E</text>
  <text x="350" y="35" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#D4A843" opacity="0.7" font-weight="700">A</text>
  <text x="400" y="40" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#D4A843" opacity="0.7" font-weight="700">D</text>
  <!-- Mirror arrows -->
  <text x="300" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#D4A843" opacity="0.45">&#x27F5; mirror symmetry &#x27F6;</text>
  <text x="300" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#D4A843" opacity="0.5">5-STRING</text>
  <text x="300" y="225" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#D4A843" opacity="0.4">Jacob Collier Signature</text>
</svg>
